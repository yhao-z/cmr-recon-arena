# common settings for all experiments
seed_everything: 3407
trainer:
  accelerator: gpu
  # log_every_n_steps: 2 # log every n steps during training
  deterministic: false
  # if using multiple GPUs, set the strategy to ddp
  # strategy: ddp
  # devices: 2
  # otherwise, use just one GPU
  devices: 1
  num_nodes: 1
  max_epochs: 150
  # max_steps: 400000
  # limit_train_batches: 10 # use all training batches
  # limit_val_batches: 100 # use all validation batches
  # val_check_interval: 10
  logger: 
    class_path: pl_modules.swanlab_logger.ProjectSwanLabLogger
    init_args:
      save_dir: experiments
      project: OCMR-SOTAs # OCMR-csm
      description: 
      experiment_name: cinevn-highacc
      mode: cloud
  callbacks:
    -
      class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true # always save the last checkpoint
        verbose: true # print checkpoint information
    - 
      class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: 'epoch'
    # -
    #   class_path: pl_modules.EMAWeightAveraging
    #   init_args:
    #     decay: 0.995 # decay rate for EMA

# data: configs/data/ocmr_highacc.yaml
model:
  class_path: pl_modules.VarNetModule
  init_args:
    model_name: CineVN
    save_val_images: true
    num_cascades: 15
    chans: 16
    pools: 2
    conv_size: 3
    conv_mode: 2d+t
    pool_temporal: False
    conv_size_temp: 3
    pad_mode_temp: circular
    residual_unet_blocks: True
    two_convs_per_unet_block: True
    view_sharing: 0
    phase_cycling: True
    fit_reg_landscape: True
    clamp_dc_weight: False
    cgdc_interval: 3
    cgdc_mu: null
    cgdc_iter: 10
    cgdc_autograd: True
    gradient_checkpointing: True
    normalize_for_loss: True
    lr: 0.0001
    lr_step_size: 50
    lr_gamma: 0.1
    weight_decay: 0.0
    loss_fns:
      - ssim
      - perp
    ssim_mode: 3d
    compile_model: False

